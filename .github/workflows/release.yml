name: Release
on:
    workflow_dispatch:
        inputs:
            version:
                description: "Bundle version (e.g. 0.0.1.1)"
                required: true
                type: string

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Restore Bun cache
              uses: actions/cache@v4
              with:
                path: ~/.bun/install/cache
                key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                restore-keys: |
                    ${{ runner.os }}-bun-

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build bundle
              run: bun run build --build-minify
              env:
                BUNDLE_VERSION: "v${{ github.event.inputs.version }}"

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                tag_name: v${{ github.event.inputs.version }}
                name: Retribution v${{ github.event.inputs.version }}
                files: dist/retribution.min.js
                generate_release_notes: true
